name: Quality Checks
on:
  push:
    branches: [main]
  pull_request:
jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npx tsc --noEmit
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: sme_platform_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d sme_platform_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://postgres:postgres@127.0.0.1:5432/sme_platform_test
      WEB_ORIGIN: http://localhost:5173
      PUBLIC_APP_URL: http://localhost:5173
      SMTP_HOST: localhost
      SMTP_FROM: noreply@example.test
      PORT: 4000
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit
      - run: npm test
      - run: |
          for f in src/*.js test/*.js; do node --check "$f"; done
      - name: Apply real PostgreSQL migrations
        run: npm run migrate
      - name: Start API and verify health and access denial
        run: |
          node src/server.js > /tmp/sme-api.log 2>&1 &
          pid=$!
          trap 'cat /tmp/sme-api.log; kill "$pid" 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:4000/health > /tmp/health.json; then break; fi
            sleep 1
          done
          grep -q '"ok"' /tmp/health.json
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/auth/me)" = "401"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/api/platform-admin/organisations)" = "401"
